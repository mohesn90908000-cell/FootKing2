
name: Build FootKing APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FootKing-Cloud-Build-Ready-Fixed-1.zip'
      - '.github/workflows/build-footking.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FootKing source
        run: |
          unzip -q FootKing-Cloud-Build-Ready-Fixed-1.zip -d source
          test -f source/FootKing/settings.gradle.kts
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/FootKing" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: footking-debug-apk
          path: source/FootKing/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
